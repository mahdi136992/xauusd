name: XAUUSD RSI Alert
on:
  schedule:
    - cron: "*/5 * * * *"      # هر ۵ دقیقه
  workflow_dispatch:
permissions:
  contents: write
concurrency: rsi-alert
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Run
        env:
          TIMEFRAMES: "15m,1h"            # ← تایم‌فریم‌ها را اینجا تغییر دهید
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TWELVEDATA_KEY: ${{ secrets.TWELVEDATA_KEY }}
          EVENT: ${{ github.event_name }}
          LOOP_SECONDS: "230"
        run: python check.py
      - name: Save state
        if: always()
        run: |
          git config user.name "bot"; git config user.email "bot@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || (git commit -m "state" && git push)
